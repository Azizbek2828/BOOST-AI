<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOST AI - Admin Panel</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="background-blobs"></div>

    <div class="container" style="padding-top: 50px;">
        <header class="glass-card user-info">
            <div class="user-details">
                <i class="fas fa-user-shield" style="font-size: 24px; color: #e11d48;"></i>
                <h3 style="margin-left: 10px;">Admin Panel</h3>
            </div>
        </header>

        <div class="glass-card">
            <p style="margin-bottom: 15px; color: #94a3b8;">Foydalanuvchi balansini to'ldirish</p>
            
            <input type="number" id="target-id" placeholder="Telegram ID raqami" class="admin-input">
            <input type="number" id="coin-amount" placeholder="Tanga miqdori" class="admin-input">

            <button onclick="sendCoins()" id="btn-send" class="admin-btn">
                TANGA YUBORISH
            </button>
        </div>
        <p id="status-text" style="text-align: center; color: yellow; font-size: 13px; margin-top: 15px;"></p>
    </div>

    <style>
        .admin-input {
            width: 100%; padding: 12px; border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.2); color: white; 
            margin-bottom: 15px; outline: none; font-size: 16px;
        }
        .admin-btn {
            width: 100%; background: linear-gradient(90deg, #e11d48, #f43f5e); 
            border: none; color: white; padding: 15px; 
            border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px;
        }
    </style>

    <script>
        // Firebase sozlamalari
        const firebaseConfig = {
          apiKey: "AIzaSyAxZ-mSgJhuTdGcH3T4oJym3qjGso71keM",
          authDomain: "user1111-c84a0.firebaseapp.com",
          databaseURL: "https://user1111-c84a0-default-rtdb.firebaseio.com",
          projectId: "user1111-c84a0",
          storageBucket: "user1111-c84a0.firebasestorage.app",
          messagingSenderId: "901723757936",
          appId: "1:901723757936:web:c94a330b79916b6b0c03b5"
        };

        // Firebase-ni ishga tushirish
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function sendCoins() {
            const idInput = document.getElementById('target-id');
            const coinInput = document.getElementById('coin-amount');
            const btn = document.getElementById('btn-send');
            const status = document.getElementById('status-text');

            const targetId = idInput.value.trim();
            const amount = parseInt(coinInput.value);

            if (!targetId || isNaN(amount)) {
                alert("ID yoki miqdor xato!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "YUBORILMOQDA...";
            status.innerText = "Baza bilan aloqa o'rnatilmoqda...";

            try {
                // To'g'ridan-to'g'ri "users/ID" yo'lini qidiramiz
                const userRef = database.ref('users/' + targetId);
                const snapshot = await userRef.once('value');

                let currentBalance = 0;
                if (snapshot.exists()) {
                    currentBalance = snapshot.val().balance || 0;
                    
                    // Mavjud foydalanuvchini yangilash
                    await userRef.update({
                        balance: currentBalance + amount
                    });
                    status.innerText = "Muvaffaqiyatli yangilandi!";
                } else {
                    // AGAR USERS YOKI FOYDALANUVCHI BO'LMASA, YANGI YARATISH
                    await userRef.set({
                        balance: amount,
                        id: targetId,
                        first_name: "Admin tomonidan qo'shilgan"
                    });
                    status.innerText = "Yangi foydalanuvchi bazada yaratildi!";
                }

                alert("Bajarildi! Yangi balans: " + (currentBalance + amount));
                idInput.value = "";
                coinInput.value = "";

            } catch (error) {
                console.error(error);
                status.innerText = "Xato: " + error.message;
                alert("Xatolik: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "TANGA YUBORISH";
            }
        }
    </script>
</body>
</html>
