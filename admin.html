<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOST AI - Admin Panel</title>
    <style>
        body { background: #0b0e14; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-card { background: #151921; padding: 30px; border-radius: 20px; width: 350px; border: 1px solid #2d333f; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #3b82f6; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #2d333f; background: #0b0e14; color: white; box-sizing: border-box; outline: none; font-size: 16px; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #2563eb; }
        button:disabled { background: #1d2433; color: #4b5563; cursor: not-allowed; }
        #msg { margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 20px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Admin Panel</h2>
    <input type="text" id="tgId" placeholder="Telegram ID (masalan: 123456)">
    <input type="number" id="coinAmt" placeholder="Qancha tanga qo'shilsin?">
    <button onclick="updateData()" id="sendBtn">TANGA YUBORISH</button>
    <p id="msg">Ma'lumotlarni kiriting va yuboring</p>
</div>

<script>
    // Siz yaratgan rasmiy API link
    const API_URL = "https://69b1056aadac80b427c3bc97.mockapi.io/users";

    async function updateData() {
        const id = document.getElementById('tgId').value.trim();
        const amt = parseInt(document.getElementById('coinAmt').value);
        const msg = document.getElementById('msg');
        const btn = document.getElementById('sendBtn');

        if(!id || isNaN(amt)) {
            alert("ID va miqdorni to'g'ri kiriting!");
            return;
        }

        btn.disabled = true;
        msg.style.color = "#94a3b8";
        msg.innerText = "Baza tekshirilmoqda...";

        try {
            // 1. Avval shu IDli foydalanuvchi bazada bormi ko'ramiz
            const res = await fetch(`${API_URL}?telegramID=${id}`);
            const users = await res.json();

            if (users && users.length > 0) {
                // FOYDALANUVCHI BOR: Balansni yangilaymiz (PUT)
                const user = users[0];
                const newBalance = (parseInt(user.balance) || 0) + amt;

                const putRes = await fetch(`${API_URL}/${user.id}`, {
                    method: 'PUT',
                    headers: {'content-type':'application/json'},
                    body: JSON.stringify({ balance: newBalance })
                });

                if(putRes.ok) {
                    msg.style.color = "#22c55e";
                    msg.innerText = `Muvaffaqiyatli! Yangi balans: ${newBalance}`;
                }
            } else {
                // FOYDALANUVCHI YO'Q: Yangi yaratamiz (POST)
                const postRes = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'content-type':'application/json'},
                    body: JSON.stringify({
                        telegramID: id,
                        balance: amt
                    })
                });

                if(postRes.ok) {
                    msg.style.color = "#22c55e";
                    msg.innerText = "Yangi foydalanuvchi yaratildi va tanga berildi!";
                }
            }
            
            document.getElementById('coinAmt').value = "";
        } catch (e) {
            console.error(e);
            msg.style.color = "#ef4444";
            msg.innerText = "Xato: Baza bilan aloqa yo'q!";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
