<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL - BOOST AI</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container" style="padding-top: 50px;">
        <div class="glass-card" style="text-align: center;">
            <h2 style="color: #f43f5e; margin-bottom: 20px;">BOOST AI ADMIN</h2>
            
            <input type="number" id="tid" placeholder="User ID" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff;">
            
            <input type="number" id="amt" placeholder="Tanga miqdori" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff;">

            <button id="sendBtn" style="width: 100%; padding: 15px; background: red; color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                TANGA YUBORISH
            </button>
            <p id="out" style="margin-top: 15px; font-size: 14px; color: yellow;"></p>
        </div>
    </div>

    <script>
        // 1. To'g'ridan-to'g'ri sozlash
        const cfg = {
            apiKey: "AIzaSyAxZ-mSgJhuTdGcH3T4oJym3qjGso71keM",
            authDomain: "user1111-c84a0.firebaseapp.com",
            databaseURL: "https://user1111-c84a0-default-rtdb.firebaseio.com",
            projectId: "user1111-c84a0",
            storageBucket: "user1111-c84a0.firebasestorage.app",
            messagingSenderId: "901723757936",
            appId: "1:901723757936:web:c94a330b79916b6b0c03b5"
        };

        firebase.initializeApp(cfg);
        const database = firebase.database();

        document.getElementById('sendBtn').onclick = async function() {
            const id = document.getElementById('tid').value;
            const amount = parseInt(document.getElementById('amt').value);
            const out = document.getElementById('out');
            const btn = this;

            if(!id || !amount) return alert("To'ldiring!");

            btn.disabled = true;
            btn.innerText = "ALOKA O'RNATILMOQDA...";
            out.innerText = "Kuting...";

            try {
                // Ma'lumotni olish uchun "timeout" qo'shamiz (agar baza javob bermasa)
                const userRef = database.ref('users/' + id);
                
                out.innerText = "Bazadan foydalanuvchi qidirilmoqda...";
                const snap = await userRef.once('value');
                
                let current = 0;
                if(snap.exists()) {
                    current = snap.val().balance || 0;
                }

                out.innerText = "Balans yangilanmoqda...";
                await userRef.update({
                    balance: current + amount
                });

                out.style.color = "#22c55e";
                out.innerText = "Muvaffaqiyatli! Oldingi: " + current + " | Yangi: " + (current + amount);
                alert("Bajarildi!");

            } catch (err) {
                console.error(err);
                out.style.color = "red";
                out.innerText = "Xato: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "TANGA YUBORISH";
            }
        };
    </script>
</body>
</html>
